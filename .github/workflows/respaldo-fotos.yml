name: Respaldo de fotos a GitHub

# ============================================
# Respaldo automático de las fotos
# cada 15 días a la 1:00 AM de El Salvador (07:00 UTC),
# los días 1 y 16 de cada mes.
#
# Origen: FIRESTORE (fotos comprimidas como DataURL dentro de
# vehiculos_fotos_base y de las órdenes). Se leen con la API key
# pública del proyecto y, desde la Fase 2 (reglas con request.auth),
# con la sesión de la cuenta de respaldo que viven en los secretos
# FIREBASE_AUTH_EMAIL / FIREBASE_AUTH_PASSWORD. Sin secretos se
# usa la API key sola, válido sólo con reglas abiertas.
# ============================================

on:
  schedule:
    - cron: '0 7 1,16 * *'
  workflow_dispatch: # ejecución manual desde la pestaña Actions

permissions:
  contents: write

concurrency:
  group: respaldo-fotos
  cancel-in-progress: false

jobs:
  respaldo:
    name: Descargar fotos y sincronizar el repo
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Descargar el repositorio (con historial)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar las fotos desde Firestore
        env:
          RESPALDO_ORIGEN: firestore
          FIREBASE_PROJECT_ID: tallerpansinaisv
          FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
          FIREBASE_AUTH_EMAIL: ${{ secrets.FIREBASE_AUTH_EMAIL }}
          FIREBASE_AUTH_PASSWORD: ${{ secrets.FIREBASE_AUTH_PASSWORD }}
        run: node scripts/respaldo-github.mjs

      - name: Guardar el respaldo en el repositorio
        run: |
          git config user.name "respaldo-pan-sinai"
          git config user.email "respaldo@tallerpansinaisv.web.app"
          git add -A
          if git diff --cached --quiet; then
            echo "Sin cambios: el respaldo ya estaba al día."
          else
            git commit -m "Respaldo automático $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push
            echo "Respaldo guardado correctamente."
          fi
